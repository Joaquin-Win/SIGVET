# Configuración de base de datos SIGVET
# ============================================================================
# Este archivo controla la conexión JDBC al servidor MySQL.
# Editarlo si el usuario/contraseña o el puerto son diferentes a los defaults.
#
# IMPORTANTE: No incluir comillas alrededor de los valores.
# ============================================================================

# URL de conexión completa a la base de datos sigvet
db.url=jdbc:mysql://localhost:3306/sigvet?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true

# Usuario de MySQL
db.usuario=root

# Contraseña de MySQL (vacía por defecto; si falla la conexión, use el diálogo al iniciar)
db.password=
